name: Сумо-дайджест

on:
  schedule:
    # 05:00 UTC ≈ 08:00 по Кишинёву летом, 07:00 зимой.
    - cron: "0 5 * * 1,4"
    # Догоняющий запуск: расписание Actions под нагрузкой пропускает запуски,
    # и это не должно стоить читателю выпуска. Если выпуск за сегодня уже есть,
    # прогон завершится сразу — run.py это проверяет сам.
    - cron: "0 11 * * 1,4"
  workflow_dispatch:
    inputs:
      period_from:
        description: "Начало периода (YYYY-MM-DD). Пусто — дата прошлого выпуска."
        required: false
        type: string
      force:
        description: "Собрать выпуск, даже если за сегодня он уже есть"
        required: false
        default: false
        type: boolean
      ignore_seen:
        description: "Пересобрать заново: не пропускать уже показанные статьи"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Прогон без публикации и коммита"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sumo-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install uv
          uv sync --frozen

      - name: Тесты и линт
        run: |
          uv run ruff check .
          uv run pytest -q

      # Прогон сетевой: обход девяти источников и вызов модели. Упавший прогон
      # повторяется — день без выпуска хуже, чем лишняя попытка.
      - name: Выпуск
        id: digest
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMO_DIGEST_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set +e
          uv run python -m sumo_digest.run \
            ${{ inputs.period_from && format('--period-from {0}', inputs.period_from) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.ignore_seen && '--ignore-seen' || '' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Повтор только там, где он может помочь. Код 2 — пустой корпус: те же
      # источники и тот же seen_urls дадут ровно тот же результат, а полный
      # прогон стоит вызова модели.
      - name: Выпуск, повтор
        id: retry
        if: steps.digest.outcome == 'failure' && steps.digest.outputs.code != '2'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMO_DIGEST_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          uv run python -m sumo_digest.run \
            ${{ inputs.period_from && format('--period-from {0}', inputs.period_from) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.ignore_seen && '--ignore-seen' || '' }}

      # Приёмка по чек-листу §7.3. Публикацию не блокирует — выпуск уже собран,
      # а провалы видно в логе прогона и в build/run.json.
      - name: Приёмка выпуска
        if: >-
          inputs.dry_run != true &&
          (steps.digest.outcome == 'success' || steps.retry.outcome == 'success')
        continue-on-error: true
        run: uv run python -m sumo_digest.acceptance --latest

      # Логи и сырой ответ модели сохраняются всегда, включая провал валидации.
      # Тексты статей наружу не уходят — только опись корпуса (инвариант 8).
      - name: Артефакты запуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            build/run.json
            build/digest.raw.json
            build/corpus.meta.json
          retention-days: 14
          if-no-files-found: warn

      - name: Коммит выпуска и состояния
        if: steps.digest.outcome == 'success' || steps.retry.outcome == 'success'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "dry run — не коммитим"; exit 0; fi
          git config user.name "sumo-digest-bot"
          git config user.email "actions@github.com"
          git add site data/state.json data/new_terms.csv data/issues
          git diff --staged --quiet && echo "изменений нет" && exit 0
          git commit -m "Выпуск $(date -u +%Y-%m-%d)"
          # Без этого пуш человека в main во время 25-минутного прогона роняет
          # шаг на non-fast-forward: выпуск уже собран и оплачен, а умирает
          # вместе с runner'ом.
          git pull --rebase --autostash origin main
          git push

      - name: Сайт артефактом для Pages
        if: >-
          vars.PAGES_ENABLED == 'true' && inputs.dry_run != true &&
          (steps.digest.outcome == 'success' || steps.retry.outcome == 'success')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Деплой включается переменной PAGES_ENABLED в настройках репозитория —
  # до того, как Pages настроены, этот job просто не запускается.
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
