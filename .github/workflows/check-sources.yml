name: Проверка источников

# Только вручную. Регулярно обходить листинги автоматически нельзя — источники
# этого не любят, и ROADMAP прямо просит запускать проверку руками.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "id источников через пробел; пусто — все включённые"
        required: false
        type: string
      show:
        description: "Сколько ссылок печатать на источник"
        required: false
        default: "5"
        type: string
      dump:
        description: "Печатать все совпавшие ссылки"
        required: false
        default: false
        type: boolean
      probe:
        description: "Разведать произвольные адреса (через пробел), вместо обычной проверки"
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install uv
          uv sync --frozen

      - name: Обход листингов
        run: |
          PROBES=""
          for url in ${{ inputs.probe }}; do PROBES="$PROBES --probe $url"; done
          uv run python scripts/check_sources.py \
            --show "${{ inputs.show }}" ${{ inputs.dump && '--dump' || '' }} \
            $PROBES ${{ inputs.sources }}
