name: Проверка источников

# Только вручную. Регулярно обходить листинги автоматически нельзя — источники
# этого не любят, и ROADMAP прямо просит запускать проверку руками.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "id источников через пробел; пусто — все включённые"
        required: false
        type: string
      show:
        description: "Сколько ссылок печатать на источник"
        required: false
        default: "5"
        type: string
      dump:
        description: "Печатать все совпавшие ссылки"
        required: false
        default: false
        type: boolean
      probe:
        description: "Разведать произвольные адреса (через пробел), вместо обычной проверки"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install uv
          uv sync --frozen

      # Входы идут через env, а не подстановкой в текст команды: GitHub
      # раскрывает ${{ }} до запуска shell, и probe вида «x; curl … | sh»
      # выполнился бы. Запустить dispatch может только тот, у кого и так есть
      # запись, так что это не дыра для чужого, а привычка, которая перестанет
      # быть безобидной на первом же соавторе.
      - name: Обход листингов
        env:
          PROBE: ${{ inputs.probe }}
          SOURCES: ${{ inputs.sources }}
          SHOW: ${{ inputs.show }}
          DUMP: ${{ inputs.dump }}
        run: |
          PROBES=""
          for url in $PROBE; do PROBES="$PROBES --probe $url"; done
          [ "$DUMP" = "true" ] && DUMP_FLAG="--dump" || DUMP_FLAG=""
          uv run python scripts/check_sources.py \
            --show "$SHOW" $DUMP_FLAG $PROBES $SOURCES
