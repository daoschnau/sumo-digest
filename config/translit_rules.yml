# Детерминированная проверка транслитерации. Каждое правило соответствует пункту
# раздела 3.4 исходной спецификации. Не сокращать и не обобщать: список рос из
# реальных ошибок в выпусках.
#
# autofix   — однозначная механическая ошибка, чинится заменой, факт замены логируется
# reject    — ошибка, которую нельзя починить автоматически: выпуск не публикуется
# warn      — подозрение, попадает в лог, публикацию не блокирует

autofix:
  # Ранги и термины
  - { wrong: "одзэки",      right: "озеки" }
  - { wrong: "Одзэки",      right: "Озеки" }
  - { wrong: "хэя",         right: "бейя" }
  - { wrong: "Хэя",         right: "Бейя" }
  - { wrong: "сэкивакэ",    right: "секиваке" }
  - { wrong: "секивакэ",    right: "секиваке" }
  - { wrong: "маэгасира",   right: "маегашира" }
  - { wrong: "маэгашира",   right: "маегашира" }
  - { wrong: "комусубэ",    right: "комусуби" }
  - { wrong: "сэкитори",    right: "секитори" }
  - { wrong: "банзукэ",     right: "бандзуке" }
  - { wrong: "банзуке",     right: "бандзуке" }
  - { wrong: "бандзукэ",    right: "бандзуке" }
  - { wrong: "сисё",        right: "ояката" }
  - { wrong: "шишо",        right: "ояката" }
  - { wrong: "сисе",        right: "ояката" }

  # Дивизионы
  - { wrong: "макусита",    right: "макушита" }
  - { wrong: "дзюре",       right: "дзюрё" }
  - { wrong: "дзёнокути",   right: "дзёнокучи" }

  # Имена с устоявшимся написанием
  - { wrong: "Хосёрю",      right: "Хошорю" }
  - { wrong: "Хосерю",      right: "Хошорю" }
  - { wrong: "Терунофудзи", right: "Терунофуджи" }
  - { wrong: "Аонисики",    right: "Аонишики" }
  - { wrong: "Тандзи",      right: "Танджи" }
  - { wrong: "Арассио",     right: "Арашио" }
  - { wrong: "Асасэкирю",   right: "Асакорю" }
  - { wrong: "Асасекирю",   right: "Асакорю" }
  - { wrong: "Асасуйрю",    right: "Асасуирю" }
  - { wrong: "Тайкайсё",    right: "Оносато" }
  - { wrong: "Сонтобиси",   right: "Такеруфуджи" }
  - { wrong: "Котоноториси", right: "Котонофуджи" }
  - { wrong: "Оносиро",     right: "Оноджо" }

  # Приёмы
  - { wrong: "хариматэ",    right: "харитэ" }

  # Прочее
  - { wrong: "аматорское сумо", right: "любительское сумо" }
  - { wrong: "Аматорское сумо", right: "Любительское сумо" }

reject:
  - id: latin_inside_cyrillic
    pattern: "[А-Яа-яЁё]+[A-Za-z]+|[A-Za-z]+[А-Яа-яЁё]+"
    message: "Латиница внутри кириллического слова. Спецификация §3.2: латинские символы внутри русских имён не используются."
    allow_if_in_parens: true      # «(romaji: Xxxx — требует проверки)» — легальная конструкция

  - id: macron
    pattern: "[āīūēōĀĪŪĒŌ]"
    message: "Макрон в русском тексте. Долгие гласные передаются без удвоения и без диакритики."

  - id: stress_mark
    pattern: "[\u0300\u0301]"
    message: "Знак ударения в имени. Спецификация §3.2: не используются."

  - id: stable_hepburn_leak
    pattern: "\\b(beya|oyakata|ozeki|yokozuna|sekitori)\\b"
    message: "Термин остался латиницей. Все японские термины передаются кириллицей."

warn:
  # Слог shi → «ш». Регулярка ловит частые случаи; полный разбор невозможен,
  # поэтому предупреждение, а не отказ.
  - id: shi_as_si
    pattern: "\\b( Araсио|Аониси|макуси|суриаси|синдеси)"
    message: "Возможно «си» вместо «ши» (§3.4 п.1)."

  - id: ji_as_dzi
    pattern: "(Фудзинокава|Андзигава)"
    message: "Возможно «дзи» вместо «джи» (§3.4 п.2)."

  - id: beya_form
    pattern: "(конюшн|комнат)[аеиыу]?\\s+[А-ЯЁ]"
    message: "Бейя обозначается как «<Название>-бея», не «конюшня/комната»."

  - id: first_mention_kanji
    check: first_mention_has_kanji
    message: "Имя рикиши при первом упоминании должно сопровождаться японским написанием в скобках либо пометкой «romaji: … — требует проверки» (§3.4 п.8)."

# Канонические написания. Используются для warn о близких вариантах
# (расстояние Левенштейна 1–2 от канонического — вероятная опечатка модели).
