# Курс иены к доллару для пересчёта сумм в выпуске: «4 784 848 иен (≈ $30 000)».
#
# Зачем файл, а не запрос в сеть и не модель. Модель курса не знает — сети у неё
# нет, — и подставила бы цифру из памяти. Запрос курса в прогоне — ещё одна
# внешняя зависимость и ещё один сбой ради пометки «≈», которой колебание
# в несколько процентов безразлично. Поэтому курс правится руками, раз в месяц-
# квартал или когда иена заметно сдвинется.
#
# Строки не переписывать, а дописывать: выпуск пересчитывается по курсу,
# действовавшему на дату выпуска (последняя строка с since <= issue_date).
# Иначе при каждой пересборке сайта доллары в архиве менялись бы задним числом.
# Выпуск раньше первой строки идёт без пересчёта.
#
# yen_per_usd — сколько иен за доллар, округлённо.

rates:
  - since: 2026-01-01
    yen_per_usd: 159   # середина ноября 2026: 158,9–160 (MUFG, XE)
