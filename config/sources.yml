# Закрытый список источников. Добавление новых — только осознанным решением,
# а не «на всякий случай». Asahi, Nikkei, Yomiuri исключены навсегда (см. спецификацию §1).
#
# link_pattern — регулярка, которой должна соответствовать ссылка со страницы листинга,
# чтобы считаться статьёй. Значения ниже — ПРЕДПОЛОЖИТЕЛЬНЫЕ: каждое проверить
# на этапе E0 скриптом scripts/check_sources.py и поправить по факту.
#
# rss — найденный фид записывается сюда на будущее. Кодом пока не читается:
# обход идёт разбором листинга, см. README.

defaults:
  timeout_seconds: 15
  user_agent: "sumo-digest/1.0 (+https://github.com/daoschnau/sumo-digest)"
  max_links_per_source: 15
  # Пауза между запросами — то, что реально защищает от бана по IP.
  # robots.txt при этом читается и запрет пишется в лог и в build/run.json,
  # но обход не останавливает: молчаливый отказ по чужому файлу — это ноль
  # вместо выпуска. Проверено 11.09.2026: восемь из девяти разрешают,
  # у dmenu файла нет. Захочешь уважить чей-то запрет — enabled: false.
  delay_seconds: 1

budget:
  max_articles: 18          # верхняя граница корпуса, подаваемого модели
  # Квота на источник в первом проходе. Без неё Sponichi со своими пятнадцатью
  # ссылками способен забрать весь бюджет, и Hochi — второй ключевой источник
  # по инварианту 3 — не попадёт в выпуск вовсе. Второй проход добирает остаток
  # без квоты, чтобы в тихий день корпус не оказался меньше возможного.
  max_articles_per_source: 4
  # Место, которое источник получает раньше, чем приоритетные добирают свою квоту.
  # Без него выпуск 14.09.2026 собрался из трёх изданий: Sponichi, Hochi
  # и Nikkan Sports выбрали весь бюджет, а Sanspo с его тремя десятками живых
  # ссылок и остальные пять источников не попали в корпус вовсе.
  min_articles_per_source: 1

sources:
  - id: sponichi
    name: Sponichi
    priority: 1
    lang: ja
    enabled: true
    listing_url: "https://www.sponichi.co.jp/sports/tokusyu/sumou/"
    rss: null
    # s00005 — код раздела сумо в имени файла. Без него шаблон ловит все
    # спортивные новости издания, попавшие на страницу (220 ссылок на E0).
    link_pattern: "/sports/news/\\d{4}/\\d{2}/\\d{2}/kiji/\\d{8}s00005\\d+c\\.html"
    note: "Ключевой источник фактуры. Обходить всегда, недоступность не понижает приоритет."

  - id: hochi
    name: Hochi News
    priority: 1
    lang: ja
    enabled: true
    # Собственные листинги Hochi (тег 大相撲 и раздел /sumo/) рисуются скриптом:
    # в разметке нет ни одной ссылки на статью, /feed/ и /sitemap.xml — 404 (E0).
    # Поэтому идентификаторы берём из перепечаток dmenu, а текст и ссылку —
    # у самого Hochi: id в адресе dmenu совпадает с родным id издания.
    listing_url: "https://hochi.news/tag/%E5%A4%A7%E7%9B%B8%E6%92%B2"
    rss: null
    link_pattern: "https://hochi\\.news/articles/[0-9]{8}-[A-Z0-9]+\\.html"
    via:
      listing_url: "https://sumo.sports.smt.docomo.ne.jp/news/"
      # Скобочная группа — то, из чего собирается канонический адрес.
      link_pattern: "topics\\.smt\\.docomo\\.ne\\.jp/article/hochi/sports/hochi-([0-9]{8}-[A-Z0-9]+)"
      canonical_url: "https://hochi.news/articles/{0}.html"
    note: |
      Ключевой источник фактуры, обходить всегда. Видим только те материалы,
      которые перепечатал dmenu, — это не весь поток издания.

  - id: nikkansports
    name: Nikkan Sports
    priority: 2
    lang: ja
    enabled: true
    listing_url: "https://www.nikkansports.com/battle/sumo/"
    # Найден на E0 через автодискавери. Использовать на E1 вместо разбора листинга.
    rss: "https://www.nikkansports.com/battle/sumo/atom.xml"
    link_pattern: "/battle/sumo/news/\\d+\\.html"

  - id: sanspo
    name: Sanspo
    priority: 2
    lang: ja
    enabled: true
    listing_url: "https://www.sanspo.com/sports/sumo/"
    rss: null
    link_pattern: "/article/\\d{8}-[A-Z0-9]+/"

  - id: nhk
    name: NHK
    priority: 3
    lang: ja
    enabled: true
    listing_url: "https://www3.nhk.or.jp/news/word/0000003.html"
    rss: null
    # Проверено на E0: страница отдаёт ссылки на новый сайт news.web.nhk,
    # статьи там вида /newsweb/na/nd-20260907de48801. Старый /news/html/… мёртв.
    link_pattern: "news\\.web\\.nhk/newsweb/na/nd-[0-9a-z]+"
    # Статьи живут не на хосте листинга. Приёмка сверяет ссылки выпуска
    # с закрытым списком, и без этой строки верный выпуск проваливал проверку.
    article_hosts: ["news.web.nhk"]

  - id: sankei
    name: Sankei
    priority: 3
    lang: ja
    enabled: true
    listing_url: "https://www.sankei.com/sports/martialarts/"
    rss: null
    link_pattern: "/article/\\d{8}-[A-Z0-9]+/"
    # Рубрика единоборств целиком: дзюдо, бокс, кэндо. Без отбора несумошный
    # материал занимает место в бюджете корпуса.
    requires_keyword: ["相撲"]
    note: "Рубрика — единоборства целиком, не только сумо. Фильтровать по содержанию."

  - id: dmenu
    name: dメニュー
    priority: 3
    lang: ja
    enabled: true
    listing_url: "https://sumo.sports.smt.docomo.ne.jp/news/"
    rss: null
    # Проверено на E0: сам dmenu статей не держит, ссылки ведут на
    # topics.smt.docomo.ne.jp/article/<издание>/sports/<id>.
    link_pattern: "topics\\.smt\\.docomo\\.ne\\.jp/article/[a-z]+/sports/"
    article_hosts: ["topics.smt.docomo.ne.jp"]
    note: |
      Агрегатор: перепечатывает Hochi, Sponichi, Sanspo, Chunichi, Daily Sports, Jiji.
      Дубли с этими источниками неизбежны — склеивать на шаге select по заголовку.

  - id: chunichi
    name: Chunichi Sports
    priority: 3
    lang: ja
    enabled: true
    listing_url: "https://www.chunichi.co.jp/chuspo/generalsports/sumo"
    rss: null
    link_pattern: "/article/\\d+"

  - id: kyodo
    name: Kyodo News
    priority: 3
    lang: en
    enabled: true
    listing_url: "https://english.kyodonews.net/news/japan"
    rss: null
    # Проверено на E0: статьи вида /articles/-/84601, по 20 штук на странице.
    link_pattern: "english\\.kyodonews\\.net/articles/-/\\d+"
    # Общая лента новостей Японии — политика, экономика, происшествия.
    requires_keyword: ["sumo", "相撲"]
    note: "Общая лента Японии. Отбирать только материалы про сумо."

  # Отчёты о днях турнира и главная схватка периода. Единственный источник,
  # который живёт в выпуске не всегда: между турнирами издание пишет об истории,
  # о прогнозах и о ставках, и в сводке новостей ему места нет. Флаг читает
  # collect, даты турниров — config/basho.yml.
  - id: sumostomp
    name: Sumo Stomp!
    priority: 2
    lang: en
    enabled: true
    only_during_basho: true
    # Листинг — фид, а не /archive: архив Substack рисуется скриптом, адреса
    # статей лежат в JSON внутри страницы, а фид отдаёт те же адреса открытым
    # текстом. Разбор ссылок у нас общий (links.raw_links) и с XML работает так
    # же, как с HTML: ищет адреса в тексте, а не по селекторам.
    listing_url: "https://www.sumo-stomp.com/feed"
    rss: "https://www.sumo-stomp.com/feed"
    # Берём только отчёты по дням: /p/2026-aki-basho-day-3-results-and,
    # пятнадцатый день — /p/2025-aki-basho-final-day-results. Прогнозы,
    # разборы бандзуке и подкасты под шаблон не подходят намеренно.
    # Хвост `[a-z-]*$` — не украшение. Проверка 15.09.2026 на живом фиде дала
    # 45 совпадений вместо пятнадцати: у каждого отчёта в фиде лежат ещё
    # страница комментариев (…-results-and/comments) и обрывок JSON с тем же
    # адресом внутри. Без закреплённого конца адреса каждый день приходил бы
    # в корпус трижды и выедал квоту источника на ровном месте.
    link_pattern: "sumo-stomp\\.com/p/\\d{4}-[a-z]+-basho-(?:day-\\d{1,2}|final-day)-results[a-z-]*$"
    # Номер дня турнира достаётся из адреса, а не спрашивается у модели: он там
    # есть, и это проверяемый факт. Группы именованные — их читает
    # basho.day_from_url, final-day считается пятнадцатым днём.
    day_pattern: "basho-(?:day-(?P<day>\\d{1,2})|(?P<final>final-day))-results"
    # Единица материала здесь — день турнира, а не статья. За период из четырёх
    # дней нужны все четыре отчёта, и общая квота в четыре статьи обрезала бы
    # хронику при первом же пропущенном прогоне.
    max_articles_per_source: 6
    note: |
      Англоязычный Substack, обходится только в дни турнира. Проверено
      15.09.2026 на живом фиде: HTTP 200, пятнадцать отчётов, robots.txt
      разрешает, RSS/Atom страница не объявляет. Фид держит ровно пятнадцать
      последних постов — на период в три-четыре дня с запасом. Отчёт о дне
      отдаёт около семи тысяч знаков текста: платная подписка закрывает
      низшие дивизионы, но не макуути.

# Исключены осознанно — не возвращать:
#   asahi, nikkei          — стабильные таймауты
#   yomiuri japan news     — не использовался
#   sumo db, glossary      — справочники, не новости
#   личный блог рикиши     — не новостной источник
