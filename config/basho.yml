# Календарь хонбасё — единственное место, где система узнаёт, идёт турнир или нет.
#
# Зачем файл, а не вычисление и не вопрос модели. Расписание Ассоциация объявляет
# за год вперёд, и выяснять его в прогоне незачем: единственный шаг, который ходит
# в сеть, собирает новости, а не расписание. Модель об этом тоже не спрашиваем —
# «идёт ли сейчас басё» проверяемый факт, а не суждение, а детерминированную
# проверку в этом проекте не заменяют самопроверкой модели.
#
# От календаря зависит ровно одно: источники с `only_during_basho: true` обходятся
# только в дни турнира. Поэтому устаревший календарь — это молчаливое исчезновение
# таких источников из выпуска, и collect предупреждает в лог заранее, когда запас
# календаря подходит к концу (basho.WARN_AHEAD_DAYS).
#
# Обновлять раз в год, когда Ассоциация объявит расписание следующего.
# Даты включительные: start — первый день (сёнихи), end — пятнадцатый (сэнсюраку).
# Названия — по руководству транслитерации: японские, не «сентябрьский турнир».

