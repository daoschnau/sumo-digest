[project]
name = "sumo-digest"
version = "0.1.0"
description = "Обзор новостей профессионального сумо на русском языке: сбор статей, выпуск от модели, статический сайт"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "trafilatura>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "Jinja2>=3.1",
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumo_digest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
