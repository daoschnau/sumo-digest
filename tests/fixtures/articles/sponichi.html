  <h1>霧島、連合稽古で19勝2敗</h1>
  <p>大相撲の霧島は9日、東京・両国国技館で行われた時津風一門の連合稽古に参加し、21番中19勝を挙げた。師匠の音羽山親方は「体はできている」と状態を評価した。</p>
  <p>霧島は先場所を右膝の負傷で途中休場しており、復調を印象づける内容となった。秋場所の番付は関脇で、大関復帰には10勝以上が必要とされる。</p>
  <p>連合稽古には幕内力士のほか十両の若手も参加し、二番出稽古の形で申し合いが行われた。</p>
